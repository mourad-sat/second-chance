name: Stabilization Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run check:prisma
        env:
          DATABASE_URL: postgresql://stabilization:stabilization@localhost:5432/stabilization

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://stabilization:stabilization@localhost:5432/stabilization

      - name: TypeScript check
        run: npm run typecheck
